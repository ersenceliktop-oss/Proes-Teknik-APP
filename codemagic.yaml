workflows:
  proes-pdf-manager:
    name: Proes PDF Manager - iOS and Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Generate native platform projects if missing
        script: |
          set -e
          if [ ! -d ios ] || [ ! -d android ]; then
            flutter create --platforms=ios,android --org com.proesteknik .
          fi
          test -f ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Proes PDF Manager'" ios/Runner/Info.plist \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Proes PDF Manager'" ios/Runner/Info.plist
          echo "iOS bundle identifier and display name will be checked during Xcode build."
      - name: Set Android compile SDK to 36
        script: |
          set -e
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '' -E 's/compileSdk[[:space:]]*=[[:space:]]*(flutter\.compileSdkVersion|[0-9]+)/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '' -E 's/compileSdkVersion[[:space:]]+(flutter\.compileSdkVersion|[0-9]+)/compileSdkVersion 36/' android/app/build.gradle
          fi
          echo "App Gradle compileSdk configuration:"
          grep -n -E 'compileSdk' android/app/build.gradle* || true
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Force file_picker compile SDK to 36
        script: |
          set -e
          PLUGIN_DIR="$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'file_picker-*' | head -n 1)"
          if [ -z "$PLUGIN_DIR" ]; then
            echo "file_picker package directory not found in pub cache"
            exit 1
          fi
          PLUGIN_GRADLE="$PLUGIN_DIR/android/build.gradle"
          if [ -f "$PLUGIN_GRADLE" ]; then
            sed -i '' -E 's/compileSdkVersion[[:space:]]+(flutter\.compileSdkVersion|[0-9]+)/compileSdkVersion 36/; s/compileSdk[[:space:]]*=[[:space:]]*(flutter\.compileSdkVersion|[0-9]+)/compileSdk = 36/' "$PLUGIN_GRADLE"
          else
            echo "file_picker Gradle file not found: $PLUGIN_GRADLE"
            exit 1
          fi
          echo "file_picker Gradle compileSdk configuration:"
          grep -n -E 'compileSdk' "$PLUGIN_GRADLE" || true
      - name: Remove generated placeholder test
        script: rm -f test/widget_test.dart
      - name: Analyze Flutter project
        script: flutter analyze --no-fatal-infos
      - name: Build iOS app (unsigned)
        script: flutter build ios --release --no-codesign
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/ios/iphoneos/Runner.app
      - build/app/outputs/flutter-apk/app-release.apk
