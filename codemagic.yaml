workflows:
  proes-drive-service:
    name: Proes Teknik Drive Service - iOS and Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Generate native platform projects if missing
        script: |
          set -e
          if [ ! -d ios ] || [ ! -d android ]; then
            flutter create --platforms=ios,android --org com.proesteknik .
          fi
          test -f ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Proes Drive Service'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Proes Drive Service'" ios/Runner/Info.plist
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Analyze Flutter project
        script: flutter analyze --no-fatal-infos
      - name: Build iOS app (unsigned)
        script: flutter build ios --release --no-codesign
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/ios/iphoneos/Runner.app
      - build/app/outputs/flutter-apk/app-release.apk
